<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>卡密商城 - 在线充值</title>
    <style>
        .product-grid { display: flex; gap: 20px; flex-wrap: wrap; }
        .product-card { border: 1px solid #ddd; padding: 20px; border-radius: 8px; width: 200px; }
        .product-card h3 { color: #1890ff; }
        .discount { color: #f5222d; font-weight: bold; }
        .buy-btn { background: #1890ff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>选择充值面额</h1>
    
    <div class="product-grid">
        <!-- 产品1：10元话费 -->
        <div class="product-card">
            <h3>10元话费</h3>
            <p>售价: <span class="price">9.8元</span></p>
            <p class="discount">立省0.2元</p>
            <button class="buy-btn" onclick="buyProduct(1001, 10)">
                立即购买
            </button>
        </div>
        
        <!-- 产品2：50元话费 -->
        <div class="product-card">
            <h3>50元话费</h3>
            <p>售价: <span class="price">48.0元</span></p>
            <p class="discount">立省2.0元</p>
            <button class="buy-btn" onclick="buyProduct(1002, 50)">
                立即购买
            </button>
        </div>
        
        <!-- 产品3：自定义金额 -->
        <div class="product-card">
            <h3>自定义充值</h3>
            <input type="number" id="customAmount" placeholder="输入金额" min="1" max="1000">
            <button class="buy-btn" onclick="buyCustom()">
                确认充值
            </button>
        </div>
    </div>
    
    <script>
        // 购买商品函数
        function buyProduct(productId, faceValue) {
            // 调用后端创建订单
            fetch('/api/order/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    product_id: productId,
                    face_value: faceValue,
                    quantity: 1
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.code === 200) {
                    // 跳转到支付页面
                    window.location.href = `/pay/${data.data.order_id}`;
                } else {
                    alert('创建订单失败: ' + data.message);
                }
            });
        }
        
        function buyCustom() {
            const amount = document.getElementById('customAmount').value;
            if (!amount || amount < 1) {
                alert('请输入有效金额');
                return;
            }
            buyProduct(9999, amount); // 9999代表自定义商品
        }
    </script>
</body>
</html>
